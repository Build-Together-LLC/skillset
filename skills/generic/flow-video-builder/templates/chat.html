<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>WhatsApp chat replay</title>
<style>
*{box-sizing:border-box;margin:0}
body{width:1440px;height:900px;overflow:hidden;font-family:"Noto Sans","Liberation Sans",Arial,sans-serif;background:radial-gradient(circle at 30% 20%,#eef2f9,#d9e1ef);display:flex;align-items:center;justify-content:center;gap:70px}
#side{width:420px;color:#1b2a4a}
#side h1{font-size:34px;line-height:1.2;margin-bottom:16px}
#side p{font-size:21px;line-height:1.5;color:#4a5a7a}
#phone{width:410px;height:840px;border-radius:44px;background:#0b141a;padding:12px;box-shadow:0 30px 70px rgba(20,40,90,.35)}
#screen{width:100%;height:100%;border-radius:34px;overflow:hidden;background:#efeae2;position:relative;display:flex;flex-direction:column}
#bar{background:#075e54;color:#fff;padding:18px 18px 14px;display:flex;align-items:center;gap:12px}
#av{width:40px;height:40px;border-radius:50%;background:#cfe9e4;color:#075e54;font-weight:700;display:flex;align-items:center;justify-content:center}
#bar b{display:block;font-size:17px}#bar small{font-size:12px;opacity:.8}
#msgs{flex:1;overflow:hidden;padding:14px 12px;display:flex;flex-direction:column;gap:8px;justify-content:flex-end}
.m{max-width:82%;padding:9px 11px 7px;border-radius:10px;font-size:14.5px;line-height:1.38;white-space:pre-wrap;word-wrap:break-word;box-shadow:0 1px 1px rgba(0,0,0,.13);animation:pop .25s ease-out}
.in{background:#fff;align-self:flex-start;border-top-left-radius:2px}
.out{background:#d9fdd3;align-self:flex-end;border-top-right-radius:2px}
.m time{display:block;text-align:right;font-size:10.5px;color:#667781;margin-top:2px}
.btns{display:flex;flex-direction:column;gap:6px;align-self:flex-start;width:82%;margin-top:-2px;animation:pop .25s ease-out}
.btn{background:#fff;color:#0a7cff;text-align:center;font-size:14.5px;font-weight:600;padding:9px;border-radius:10px;box-shadow:0 1px 1px rgba(0,0,0,.13);transition:all .25s}
.btn.tap{background:#cfe3ff;transform:scale(.97);outline:3px solid #e53935}
#sheet{position:absolute;left:0;right:0;bottom:-420px;background:#fff;border-radius:18px 18px 0 0;padding:14px 16px 20px;box-shadow:0 -8px 24px rgba(0,0,0,.2);transition:bottom .35s ease;z-index:5}
#sheet.open{bottom:0}
#sheet h4{font-size:15px;margin-bottom:8px;color:#111}
.row{display:flex;justify-content:space-between;align-items:center;padding:9px 4px;border-bottom:1px solid #eee;font-size:14.5px;color:#222}
.row small{display:block;color:#667781;font-size:11.5px}
.dot{width:18px;height:18px;border-radius:50%;border:2px solid #9aa5b1;flex:none}
.row.sel .dot{border-color:#25d366;background:radial-gradient(#25d366 45%,transparent 50%)}
.row.sel{outline:3px solid #e53935;border-radius:6px}
#inp{background:#f0f2f5;padding:9px 12px;color:#8696a0;font-size:14px}
@keyframes pop{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
#cap{position:absolute;left:0;right:0;top:0;text-align:center}
</style></head><body>
<div id="side"><h1 id="t1"></h1><p id="t2"></p></div>
<div id="phone"><div id="screen">
<div id="bar"><div id="av">S</div><div><b>School admissions</b><small>Business account (demo)</small></div></div>
<div id="msgs"></div>
<div id="inp">Message</div>
<div id="sheet"><h4 id="sheetT">Choose</h4><div id="rows"></div></div>
</div></div>
<script>
const $=s=>document.querySelector(s);
const now=()=>{const d=new Date();return d.toLocaleTimeString('en-IN',{hour:'numeric',minute:'2-digit',hour12:true}).toLowerCase()};
window.side=(a,b)=>{$('#t1').textContent=a||'';$('#t2').textContent=b||''};
window.say=(side,text,btns)=>{
  const m=document.createElement('div');m.className='m '+side;m.innerHTML='<span></span><time>'+now()+'</time>';m.firstChild.textContent=text;$('#msgs').appendChild(m);
  if(btns){const w=document.createElement('div');w.className='btns';btns.forEach(t=>{const b=document.createElement('div');b.className='btn';b.textContent=t;w.appendChild(b)});$('#msgs').appendChild(w);}
  const all=$('#msgs');while(all.scrollHeight>all.clientHeight+2&&all.children.length>2){all.removeChild(all.firstChild)}
};
window.tapBtn=t=>{[...document.querySelectorAll('.btn')].filter(b=>b.textContent===t).slice(-1).forEach(b=>b.classList.add('tap'))};
window.openList=(title,rows)=>{$('#sheetT').textContent=title;$('#rows').innerHTML='';rows.forEach((r,i)=>{const d=document.createElement('div');d.className='row';d.innerHTML='<div><span class=l></span><small></small></div><div class=dot></div>';d.querySelector('.l').textContent=r[0];d.querySelector('small').textContent=r[1]||'';$('#rows').appendChild(d)});$('#sheet').classList.add('open')};
window.pickRow=i=>{const r=document.querySelectorAll('.row')[i];r&&r.classList.add('sel');return r?r.querySelector('.l').textContent:''};
window.closeList=()=>$('#sheet').classList.remove('open');
</script></body></html>
