<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>Example app</title>
<style>
body{font-family:"Noto Sans",Arial,sans-serif;margin:0;background:#f5f7fb;color:#1b2a4a}
header{background:#fff;border-bottom:1px solid #dfe5f0;padding:18px 40px;font-weight:700;font-size:22px}
main{max-width:760px;margin:40px auto;padding:0 24px}
.card{background:#fff;border:1px solid #dfe5f0;border-radius:12px;padding:24px;margin-bottom:24px}
label{display:block;font-size:14px;margin:12px 0 6px;color:#5b6b8c}
input{width:100%;box-sizing:border-box;padding:10px;border:1px solid #c9d3e6;border-radius:8px;font-size:16px}
button{margin-top:18px;padding:10px 22px;border:0;border-radius:8px;background:#4f46e5;color:#fff;font-size:16px;cursor:pointer}
#done{display:none;color:#0f7b43;font-weight:700;margin-top:16px}
.secret{color:#999}
</style></head><body>
<header>Example booking app</header>
<main>
 <div class="card"><h1 id="title">Book a visit</h1><p>Pick a name and an email, then confirm.</p></div>
 <div class="card">
  <label for="name">Your name</label><input id="name" placeholder="Name">
  <label for="email">Email</label><input id="email" placeholder="Email">
  <button id="go" onclick="document.getElementById('done').style.display='block'">Confirm booking</button>
  <div id="done">Booking confirmed. Reference EX-0001.</div>
 </div>
 <p class="secret" id="staff">Host: Jane Realperson (this name is removed by the scrub rule in the example)</p>
</main></body></html>
