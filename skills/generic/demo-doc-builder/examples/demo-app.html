<!doctype html><html><head><meta charset="utf-8"><title>Acme Settings</title><style>
body{margin:0;font-family:Arial,sans-serif;background:#f4f6f8;color:#1f272e}
.top{background:#0f764a;color:#fff;padding:14px 24px;font-size:18px;font-weight:700}
.card{background:#fff;margin:24px;padding:24px;border-radius:10px;box-shadow:0 1px 3px rgba(0,0,0,.15);max-width:760px}
label{display:block;font-size:13px;color:#475569;margin:14px 0 4px}input{width:100%;box-sizing:border-box;padding:9px 11px;border:1px solid #cbd5e1;border-radius:6px;font-size:15px}
button{margin-top:18px;background:#0f764a;color:#fff;border:0;padding:10px 18px;border-radius:6px;font-size:15px;cursor:pointer}.ok{display:none;margin-top:14px;background:#ecfdf5;border-left:4px solid #16a34a;padding:10px 12px}
.qr{width:120px;height:120px;background:repeating-conic-gradient(#000 0 25%,#fff 0 50%) 0 0/24px 24px;margin-top:14px}
</style></head><body><div class="top">Acme Settings</div><div class="card">
<h2 style="margin-top:0">Connection</h2>
<label>Server address</label><input id="host" value="https://acme.example.com">
<label>API key</label><input id="key" type="password" value="example-secret-value-1234">
<label>Scan this code with the app</label><div class="qr" id="qr"></div>
<button id="save" onclick="document.getElementById('ok').style.display='block'">Save and test</button>
<div class="ok" id="ok">Connected successfully.</div></div></body></html>
